name: Publish eslint nextjs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/npm_publish_nextjs.yml'
      - 'eslint-config-nextjs/**'
      - '!eslint-config-nextjs/package.json'
      - '!eslint-config-nextjs/package-lock.json'
      - '!eslint-config-nextjs/pnpm-lock.yaml'
      - '!eslint-config-nextjs/README.md'

concurrency:
  group: publish-eslint-nextjs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./eslint-config-nextjs

    permissions:
      contents: write
      id-token: write

    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm
        run: npm install -g npm@^11

      - name: Update version
        run: npm version patch --no-git-tag-version

      - name: Commit and push version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json
          if [ -f package-lock.json ]; then
            git add package-lock.json
          fi

          base_commit=$(git rev-parse HEAD)
          git commit -m "chore(package.json): update version"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if ! git merge-base --is-ancestor "$base_commit" origin/main; then
              echo "Remote main history changed. Stopping without force push."
              exit 1
            fi

            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "Push failed after 5 attempts."
          exit 1

      - name: Publish to NPM (OIDC)
        run: npm publish --access public --provenance